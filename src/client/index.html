<!doctype html>
<html lang="en" data-theme="glacier" data-backdrop="on">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="dark" />
		<meta name="theme-color" content="#0b0d11" />
		<meta name="description" content="Deblocker is a self-hosted web proxy powered by Scramjet." />
		<title>Deblocker</title>
		<link rel="icon" type="image/svg+xml" href="./favicon.svg" />
		<script>
			// Apply the saved theme before first paint to avoid a flash of the default colours.
			try {
				const saved = JSON.parse(localStorage.getItem("deblocker:settings") || "{}");
				if (saved.theme) document.documentElement.dataset.theme = saved.theme;
				if (saved.backdrop === false) document.documentElement.dataset.backdrop = "off";
			} catch {}
		</script>
		<script type="module" src="./src/main.ts"></script>
	</head>
	<body>
		<div class="backdrop" aria-hidden="true">
			<svg class="backdrop-art" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice">
				<defs>
					<linearGradient id="bd-sky" x1="0" y1="0" x2="0" y2="1">
						<stop offset="0" stop-color="var(--sky-top)" />
						<stop offset="1" stop-color="var(--sky-bottom)" />
					</linearGradient>
					<radialGradient id="bd-glow" cx="0.5" cy="0.5" r="0.5">
						<stop offset="0" stop-color="var(--accent-lit)" stop-opacity="0.14" />
						<stop offset="1" stop-color="var(--accent-lit)" stop-opacity="0" />
					</radialGradient>
					<mask id="bd-crescent">
						<circle cx="1040" cy="250" r="30" fill="#fff" />
						<circle cx="1053" cy="241" r="26" fill="#000" />
					</mask>
				</defs>
				<rect width="1600" height="900" fill="url(#bd-sky)" />
				<g class="backdrop-stars"></g>
				<circle cx="1040" cy="250" r="240" fill="url(#bd-glow)" />
				<circle class="backdrop-moon" cx="1040" cy="250" r="30" mask="url(#bd-crescent)" />
				<path class="ridge ridge-far" d="M0 610 80 588 150 552 230 578 320 512 410 556 505 494 600 536 690 466 790 526 875 498 975 540 1075 476 1175 528 1255 500 1355 550 1450 508 1530 534 1600 520V900H0Z" />
				<path class="ridge ridge-mid" d="M0 700 115 648 210 688 320 622 425 668 540 606 650 662 760 598 860 648 970 590 1090 656 1200 612 1310 666 1420 620 1520 656 1600 636V900H0Z" />
				<path class="ridge ridge-near" d="M0 788C120 744 220 764 320 734 430 704 520 752 640 728 760 704 860 762 980 738 1100 714 1200 762 1320 742 1440 722 1520 752 1600 738V900H0Z" />
			</svg>
		</div>

		<div class="shell" id="shell">
			<header class="tabbar">
				<div class="tabs" id="tabs" role="group" aria-label="Tabs"></div>
				<button class="tab-new" id="newTab" type="button" title="New tab (Alt+T)" aria-label="New tab">
					<svg class="icon"><use href="#i-plus" /></svg>
				</button>
				<button class="status-chip" id="statusChip" type="button" data-state="checking" title="Proxy backend status">
					<span class="status-dot"></span>
					<span class="status-text" id="statusText">connecting…</span>
				</button>
			</header>

			<div class="toolbar">
				<div class="nav-buttons">
					<button class="tool-btn" id="backBtn" type="button" title="Back (Alt+←)" aria-label="Back" disabled>
						<svg class="icon"><use href="#i-arrow-left" /></svg>
					</button>
					<button class="tool-btn" id="forwardBtn" type="button" title="Forward (Alt+→)" aria-label="Forward" disabled>
						<svg class="icon"><use href="#i-arrow-right" /></svg>
					</button>
					<button class="tool-btn" id="reloadBtn" type="button" title="Reload (Alt+R)" aria-label="Reload">
						<svg class="icon icon-reload"><use href="#i-rotate-cw" /></svg>
						<svg class="icon icon-stop"><use href="#i-x" /></svg>
					</button>
					<button class="tool-btn hide-mobile" id="homeBtn" type="button" title="Home (Alt+Home)" aria-label="Home">
						<svg class="icon"><use href="#i-house" /></svg>
					</button>
				</div>
				<form class="omnibox" id="omnibox" role="search" autocomplete="off">
					<span class="omnibox-icon" id="omniboxIcon" data-kind="search" aria-hidden="true">
						<svg class="icon" id="omniboxIconSvg"><use href="#i-search" /></svg>
					</span>
					<input
						id="omniboxInput"
						class="omnibox-input"
						type="text"
						inputmode="url"
						spellcheck="false"
						autocapitalize="off"
						enterkeyhint="go"
						placeholder="Search or enter address"
						aria-label="Search or enter address"
					/>
				</form>
				<button class="tool-btn hide-mobile" id="fullscreenBtn" type="button" title="Full screen page" aria-label="Show page in full screen" disabled>
					<svg class="icon"><use href="#i-maximize" /></svg>
				</button>
			</div>
			<div class="progress" id="progress" aria-hidden="true"></div>

			<div class="workspace">
				<nav class="rail" id="rail" aria-label="Deblocker">
					<button class="rail-btn" type="button" data-nav="home" title="Home" aria-label="Home">
						<svg class="icon"><use href="#i-house" /></svg>
						<span class="rail-label">home</span>
					</button>
					<button class="rail-btn mobile-only" type="button" data-nav="new-tab" title="New tab" aria-label="New tab">
						<svg class="icon"><use href="#i-plus" /></svg>
						<span class="rail-label">new tab</span>
					</button>
					<span class="rail-spacer"></span>
					<button class="rail-btn" type="button" data-nav="settings" title="Settings" aria-label="Settings">
						<svg class="icon"><use href="#i-settings" /></svg>
						<span class="rail-label">settings</span>
					</button>
					<button class="rail-btn" type="button" data-nav="about" title="About Deblocker" aria-label="About Deblocker">
						<svg class="icon"><use href="#i-info" /></svg>
						<span class="rail-label">about</span>
					</button>
				</nav>

				<main class="stage" id="stage">
					<section class="view view-home" id="view-home" aria-label="Home" hidden>
						<div class="home">
							<div class="brand">
								<svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
									<path class="mark-block" d="M6 7h4v7h7v4a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3v-8a3 3 0 0 1 3-3z" />
									<rect class="mark-piece" x="14" y="3" width="7" height="7" rx="2" />
								</svg>
								<h1 class="wordmark" id="wordmark" aria-label="deblocker">deblocker</h1>
							</div>
							<form class="search" id="homeSearch" role="search" autocomplete="off">
								<svg class="icon search-icon" aria-hidden="true"><use href="#i-search" /></svg>
								<input
									id="homeInput"
									class="search-input"
									type="text"
									inputmode="url"
									spellcheck="false"
									autocapitalize="off"
									enterkeyhint="go"
									placeholder="Search or enter an address"
									aria-label="Search the web or enter an address"
								/>
								<button class="search-go" type="submit" aria-label="Go" title="Go">
									<svg class="icon"><use href="#i-arrow-right" /></svg>
								</button>
							</form>
							<p class="home-message" id="homeMessage" role="alert" hidden></p>

							<form class="unlock" id="unlockForm" hidden>
								<p class="unlock-title">
									<svg class="icon"><use href="#i-key" /></svg>
									This Deblocker server needs an access key
								</p>
								<div class="unlock-row">
									<input id="unlockInput" class="field" type="password" autocomplete="current-password" placeholder="access key" aria-label="Access key" required />
									<button class="btn btn-accent" type="submit">unlock</button>
								</div>
								<p class="unlock-error" id="unlockError" role="alert" hidden></p>
							</form>

							<div class="quicklinks" id="quickLinks" aria-label="Quick links"></div>
						</div>
					</section>

					<section class="view view-settings" id="view-settings" aria-label="Settings" hidden></section>
					<section class="view view-about" id="view-about" aria-label="About Deblocker" hidden></section>

					<div class="frames" id="frames"></div>

					<div class="loader" id="loader" hidden>
						<div class="loader-card">
							<span class="spinner" aria-hidden="true"></span>
							<p class="loader-text" id="loaderText">loading…</p>
							<p class="loader-slow" id="loaderSlow" hidden>
								This is taking a while.
								<button class="link-btn" id="loaderStop" type="button">Stop</button>
							</p>
						</div>
					</div>

					<div class="page-error" id="pageError" role="alert" hidden>
						<div class="page-error-card">
							<span class="page-error-icon" aria-hidden="true"><svg class="icon"><use href="#i-alert" /></svg></span>
							<h2 class="page-error-title" id="pageErrorTitle"></h2>
							<p class="page-error-text" id="pageErrorText"></p>
							<p class="page-error-detail" id="pageErrorDetail" hidden></p>
							<p class="page-error-url" id="pageErrorUrl"></p>
							<div class="page-error-actions" id="pageErrorActions"></div>
						</div>
					</div>
				</main>
			</div>
		</div>

		<div class="toasts" id="toasts" aria-live="polite"></div>

		<svg width="0" height="0" style="position: absolute" aria-hidden="true">
			<!-- Line icons adapted from Lucide (ISC License, https://lucide.dev) -->
			<symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14" /><path d="M12 5v14" /></symbol>
			<symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></symbol>
			<symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7" /><path d="M19 12H5" /></symbol>
			<symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14" /><path d="m12 5 7 7-7 7" /></symbol>
			<symbol id="i-arrow-up" viewBox="0 0 24 24"><path d="m5 12 7-7 7 7" /><path d="M12 19V5" /></symbol>
			<symbol id="i-arrow-down" viewBox="0 0 24 24"><path d="M12 5v14" /><path d="m19 12-7 7-7-7" /></symbol>
			<symbol id="i-rotate-cw" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" /><path d="M21 3v5h-5" /></symbol>
			<symbol id="i-house" viewBox="0 0 24 24"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" /><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /></symbol>
			<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" /></symbol>
			<symbol id="i-settings" viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" /><circle cx="12" cy="12" r="3" /></symbol>
			<symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" /><path d="M12 16v-4" /><path d="M12 8h.01" /></symbol>
			<symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" /><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20" /><path d="M2 12h20" /></symbol>
			<symbol id="i-lock" viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></symbol>
			<symbol id="i-lock-open" viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 9.9-1" /></symbol>
			<symbol id="i-alert" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" /><path d="M12 9v4" /><path d="M12 17h.01" /></symbol>
			<symbol id="i-external" viewBox="0 0 24 24"><path d="M15 3h6v6" /><path d="M10 14 21 3" /><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" /></symbol>
			<symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18" /><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" /><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" /><path d="M10 11v6" /><path d="M14 11v6" /></symbol>
			<symbol id="i-pencil" viewBox="0 0 24 24"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z" /><path d="m15 5 4 4" /></symbol>
			<symbol id="i-palette" viewBox="0 0 24 24"><circle cx="13.5" cy="6.5" r=".5" fill="currentColor" /><circle cx="17.5" cy="10.5" r=".5" fill="currentColor" /><circle cx="8.5" cy="7.5" r=".5" fill="currentColor" /><circle cx="6.5" cy="12.5" r=".5" fill="currentColor" /><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z" /></symbol>
			<symbol id="i-keyboard" viewBox="0 0 24 24"><path d="M10 8h.01" /><path d="M12 12h.01" /><path d="M14 8h.01" /><path d="M16 12h.01" /><path d="M18 8h.01" /><path d="M6 8h.01" /><path d="M7 16h10" /><path d="M8 12h.01" /><rect width="20" height="16" x="2" y="4" rx="2" /></symbol>
			<symbol id="i-shield" viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" /><path d="m9 12 2 2 4-4" /></symbol>
			<symbol id="i-key" viewBox="0 0 24 24"><path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z" /><circle cx="16.5" cy="7.5" r=".5" fill="currentColor" /></symbol>
			<symbol id="i-bookmark" viewBox="0 0 24 24"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z" /></symbol>
			<symbol id="i-maximize" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3" /><path d="M21 8V5a2 2 0 0 0-2-2h-3" /><path d="M3 16v3a2 2 0 0 0 2 2h3" /><path d="M16 21h3a2 2 0 0 0 2-2v-3" /></symbol>
			<symbol id="i-unplug" viewBox="0 0 24 24"><path d="m19 5 3-3" /><path d="m2 22 3-3" /><path d="M6.3 20.3a2.4 2.4 0 0 0 3.4 0L12 18l-6-6-2.3 2.3a2.4 2.4 0 0 0 0 3.4Z" /><path d="M7.5 13.5 10 11" /><path d="M10.5 16.5 13 14" /><path d="m12 6 6 6 2.3-2.3a2.4 2.4 0 0 0 0-3.4l-2.6-2.6a2.4 2.4 0 0 0-3.4 0Z" /></symbol>
			<symbol id="i-brand" viewBox="0 0 24 24"><path d="M6 7h4v7h7v4a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3v-8a3 3 0 0 1 3-3z" /><rect x="14" y="3" width="7" height="7" rx="2" /></symbol>
		</svg>
	</body>
</html>
