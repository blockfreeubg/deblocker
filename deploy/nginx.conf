# Deblocker behind nginx (HTTPS terminated here, Node on 127.0.0.1:8080).
# Pair with: HOST=127.0.0.1 TRUST_PROXY=loopback in Deblocker's environment.
# Get the certificate BEFORE installing this file (nginx won't load it while the files are missing):
#   sudo certbot certonly --nginx -d proxy.example.com

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name proxy.example.com;
    return 301 https://$host$request_uri;
}

server {
    # On nginx 1.25.1+ you may write `listen 443 ssl;` plus `http2 on;` instead.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name proxy.example.com;

    ssl_certificate     /etc/letsencrypt/live/proxy.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/proxy.example.com/privkey.pem;

    # Deblocker at the domain root (BASE_PATH=/).
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # Required for the Wisp WebSocket at /wisp/.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Deblocker checks that the WebSocket Origin matches Host, so forward the original Host
        # header including any port ($http_host, not $host, which drops the port).
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;

        # Proxied pages can keep WebSockets open for a long time.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    # --- Sub-path variant ---------------------------------------------------------
    # To serve Deblocker at https://proxy.example.com/deblocker/ instead, set BASE_PATH=/deblocker
    # and use this block (note: no trailing slash on proxy_pass, so the prefix is passed through).
    #
    # location /deblocker/ {
    #     proxy_pass http://127.0.0.1:8080;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection $connection_upgrade;
    #     proxy_set_header Host $http_host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_set_header X-Forwarded-Host $http_host;
    #     proxy_read_timeout 1h;
    #     proxy_send_timeout 1h;
    #     proxy_buffering off;
    # }
}
